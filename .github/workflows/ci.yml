name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (pinned)
        run: python -m pip install uv==0.12.4
      - name: Sync
        run: uv sync --frozen --all-extras --group dev
      - name: Offline verification
        run: uv run --frozen python scripts/verify.py --offline

  required:
    name: required
    needs: offline-verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every offline verification job
        env:
          OFFLINE_VERIFY_RESULT: ${{ needs.offline-verify.result }}
        run: test "$OFFLINE_VERIFY_RESULT" = "success"
