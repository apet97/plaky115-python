name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # actions/setup-python v5.3.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (pinned)
        run: python -m pip install uv==0.12.4
      - name: Sync
        run: uv sync --frozen --all-extras --group dev
      - name: Offline verification
        run: uv run --frozen python scripts/verify.py --offline

  required:
    name: required
    needs: offline-verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every offline verification job
        env:
          OFFLINE_VERIFY_RESULT: ${{ needs.offline-verify.result }}
        run: test "$OFFLINE_VERIFY_RESULT" = "success"
