name: release

# Publishes to PyPI through trusted publishing (OIDC, no stored token).
# Prerequisite: register this repository + workflow as a trusted publisher
# for the "plaky115" project on pypi.org. Publication only runs for
# version tags, which are pushed manually under separate authorization.
#
# The verify job runs the full release gate suite (including the online
# dependency audit) and builds the artifacts; publish consumes exactly
# those artifacts. Never rebuild between verification and publication.

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install uv (pinned)
        run: python -m pip install uv==0.12.4
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Fetch pinned parity source
        env:
          SOURCE_COMMIT: 33ae2926aa696f36d9663d44f914d42d9aadc53f
        run: |
          source_dir="$RUNNER_TEMP/plaky115-source"
          git clone --no-checkout https://github.com/apet97/plaky115.git "$source_dir"
          git -C "$source_dir" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Sync
        run: uv sync --frozen --all-extras --group dev
      - name: Version must match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --frozen python -c 'from plaky115._version import __version__; print(__version__)')"
          test "$version" = "${TAG#v}"
      - name: Release verification (offline gates + dependency audit)
        env:
          PLAKY115_SOURCE_CHECKOUT: ${{ runner.temp }}/plaky115-source
        run: uv run --frozen python scripts/verify.py --release-online
      - name: Built artifacts must carry exactly the tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "dist/plaky115-${TAG#v}-py3-none-any.whl"
          test -f "dist/plaky115-${TAG#v}.tar.gz"
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      # pypa/gh-action-pypi-publish v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          print-hash: true
